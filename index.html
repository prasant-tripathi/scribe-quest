<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scribe Quest: Restoration Multiplayer</title>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <style>
        :root { --saffron: #FF9933; --temple: #5d4037; --wisdom: #4CAF50; }
        body { font-family: 'Segoe UI', sans-serif; background: #fdf5e6; display: flex; flex-direction: column; align-items: center; }
        .game-container { background: white; border: 5px double var(--temple); width: 90%; max-width: 800px; padding: 20px; margin-top: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .stats-bar { display: flex; justify-content: space-between; font-weight: bold; color: var(--temple); border-bottom: 2px solid var(--saffron); padding-bottom: 10px; }
        .mission-box { background: #fff9f0; padding: 15px; text-align: center; margin: 20px 0; border: 1px dashed var(--saffron); }
        .word-slots { display: flex; justify-content: space-around; gap: 10px; margin: 20px 0; }
        .slot { border: 2px solid #ccc; padding: 20px; min-width: 100px; text-align: center; border-radius: 10px; }
        .slot.active { border-color: var(--saffron); background: #fffdfa; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 10px; cursor: pointer; background: white; border: 2px solid var(--temple); font-weight: bold; }
        button:hover { background: var(--saffron); color: white; }
        #feedback { height: 30px; text-align: center; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="stats-bar">
        <span id="wisdom-meter">Wisdom: 0/100</span>
        <span id="life-meter">Lives: 5/5</span>
    </div>

    <div class="mission-box">
        <h2 id="mission-text">Waiting for Scribes...</h2>
        <p id="hint-text">Connect and start the Restoration.</p>
    </div>

    <div class="word-slots">
        <div class="slot" id="slot-karta">Karta<br><small>(ne)</small><div class="val">?</div></div>
        <div class="slot" id="slot-karma">Karma<br><small>(ko)</small><div class="val">?</div></div>
        <div class="slot" id="slot-karan">Karan<br><small>(se)</small><div class="val">?</div></div>
    </div>

    <div class="controls" id="player-controls">
        <button onclick="cycleWord('Balaka')">Cycle: Balaka (Masculine)</button>
        <button onclick="cycleWord('Kavi')">Cycle: Kavi (I-Ending)</button>
        <button onclick="submitWord()">Submit to Slot</button>
        <button id="start-btn" onclick="startMission()">Start Mission</button>
    </div>
    
    <div id="feedback"></div>
</div>

<script>
    // Data from Pages 2, 4, and 5
    const Dictionary = {
        "Balaka": ["बालकः", "बालकम्", "बालकेन", "बालकाय"], // [cite: 114]
        "Kavi": ["कविः", "कविम्", "कविना", "कवये"] // [cite: 7]
    };

    let wisdom = 0;
    let lives = 5;
    let currentWordIdx = 0;
    let selectedWord = "बालकः";

    function cycleWord(type) {
        currentWordIdx = (currentWordIdx + 1) % 4;
        selectedWord = Dictionary[type][currentWordIdx];
        document.getElementById('feedback').innerText = "Selected: " + selectedWord;
    }

    function startMission() {
        document.getElementById('mission-text').innerText = "MISSION: The Sage (Karta) looks at the Boy (Karma)!";
        document.getElementById('hint-text').innerText = "Logic: Doer uses Prathama, Object uses Dwitiya ";
    }

    function submitWord() {
        const feedback = document.getElementById('feedback');
        // Logic for "The Sage (Kavi) looks at the Boy (Balaka)"
        // Sage as Karta = कविः (Prathama) [cite: 7]
        // Boy as Karma = बालकम् (Dwitiya) [cite: 114]
        
        if (selectedWord === "कविः") {
            document.querySelector('#slot-karta .val').innerText = "कविः";
            checkWin();
        } else if (selectedWord === "बालकम्") {
            document.querySelector('#slot-karma .val').innerText = "बालकम्";
            checkWin();
        } else {
            lives--;
            feedback.innerText = "Error: Incorrect Vibhakti! Check Chinha ";
            feedback.style.color = "red";
            document.getElementById('life-meter').innerText = "Lives: " + lives + "/5";
        }
    }

    function checkWin() {
        const k1 = document.querySelector('#slot-karta .val').innerText;
        const k2 = document.querySelector('#slot-karma .val').innerText;
        if (k1 === "कविः" && k2 === "बालकम्") {
            wisdom += 20;
            document.getElementById('wisdom-meter').innerText = "Wisdom: " + wisdom + "/100";
            document.getElementById('feedback').innerText = "Success! Wisdom Restored.";
            document.getElementById('feedback').style.color = "green";
        }
    }
</script>
</body>
</html>
