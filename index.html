<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scribe Quest: The Dharma Hub</title>
    <style>
        :root { --saffron: #FF9933; --temple: #5d4037; --wisdom: #4CAF50; --error: #D32F2F; --gold: #FFD700; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a0f0d; color: white; margin: 0; overflow: hidden; height: 100vh; }
        
        /* Intro UI */
        #intro-overlay { position: fixed; inset: 0; background: radial-gradient(circle, #3d2b26, #1a0f0d); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .role-box { border: 1px solid var(--gold); padding: 20px; margin: 10px; border-radius: 10px; width: 300px; background: rgba(0,0,0,0.2); }
        
        /* Dashboard */
        .dashboard { display: none; grid-template-columns: 320px 1fr 320px; grid-template-rows: 80px 1fr 100px; height: 100vh; gap: 10px; padding: 10px; box-sizing: border-box; }
        header { grid-column: 1 / -1; background: var(--temple); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border: 2px solid var(--saffron); border-radius: 8px; }
        .panel { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,153,51,0.2); }
        
        /* Chakra */
        .wheel-container { position: relative; width: 350px; height: 350px; margin: auto; }
        .chakra { width: 100%; height: 100%; border-radius: 50%; border: 10px double var(--saffron); position: relative; transition: transform 0.6s; background: white; }
        .spoke { position: absolute; width: 100%; text-align: center; font-weight: bold; color: var(--temple); transform-origin: center; top: 50%; margin-top: -10px;}
        .pointer { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--gold); z-index: 10; }
        
        .btn { padding: 10px; cursor: pointer; border: 1px solid var(--saffron); background: transparent; color: white; font-weight: bold; width: 100%; margin: 5px 0; border-radius: 4px; }
        .scribe-log { height: 220px; background: rgba(0,0,0,0.3); padding: 10px; overflow-y: auto; font-size: 0.8rem; border: 1px solid #444; }
        input { padding: 10px; margin: 10px; background: #222; color: white; border: 1px solid var(--saffron); }
    </style>
</head>
<body>

<div id="intro-overlay">
    <h1 style="color:var(--saffron); font-size: 3rem; margin-bottom: 0;">SCRIBE QUEST</h1>
    <input type="text" id="scribe-name" placeholder="Enter Your Name">
    <div style="display: flex; gap: 10px;">
        <div class="role-box">
            <h3>Grand Librarian</h3>
            <input type="password" id="host-pass" placeholder="Sacred Key">
            <button class="btn" onclick="initializeRole('host')" style="background:var(--saffron)">HOST HUB</button>
        </div>
        <div class="role-box">
            <h3>Seeking Scribe</h3>
            <input type="text" id="join-id" placeholder="Paste Hub Code">
            <button class="btn" onclick="initializeRole('client')">JOIN HUB</button>
        </div>
    </div>
</div>

<div class="dashboard" id="game-ui">
    <header>
        <div id="display-name" style="color:var(--gold)">...</div>
        <div id="conn-status" style="color:var(--saffron)">Connecting...</div>
        <div>TEAM WISDOM: <span id="wisdom-val">0</span></div>
    </header>

    <aside class="panel">
        <h2 style="color:var(--saffron)">Mission</h2>
        <div id="mission-text" style="font-size: 1.1rem; color: var(--gold);">---</div>
        <div id="hint-text" style="font-size: 0.8rem; color: #aaa; margin-top: 5px;"></div>
        <div id="host-info" style="display:none; margin-top:20px; border-top: 1px solid #444; padding-top: 10px;">
            <p style="font-size: 0.7rem;">Share this Hub Code:</p>
            <b id="my-id" style="color:var(--gold); word-break: break-all; font-size:0.8rem;">...</b>
        </div>
    </aside>

    <main style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <div class="wheel-container">
            <div class="pointer"></div>
            <div id="chakra" class="chakra"></div>
        </div>
        <div style="margin-top:10px; display:flex; gap:10px;">
            <button class="btn" onclick="rotateWheel(-1)" style="width:80px">LEFT</button>
            <button class="btn" onclick="rotateWheel(1)" style="width:80px">RIGHT</button>
        </div>
        <button class="btn" style="background:var(--wisdom); width:200px; margin-top:10px;" onclick="doRestore()">RESTORE FRAGMENT</button>
    </main>

    <aside class="panel">
        <h2 style="color:var(--saffron)">Word Vault</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 5px;">
            <button class="btn" style="font-size: 0.7rem;" onclick="changeNoun('Balaka')">Balaka</button>
            <button class="btn" style="font-size: 0.7rem;" onclick="changeNoun('Kavi')">Kavi</button>
            <button class="btn" style="font-size: 0.7rem;" onclick="changeNoun('Balika')">Balika</button>
            <button class="btn" style="font-size: 0.7rem;" onclick="changeNoun('Sadhu')">Sadhu</button>
        </div>
        <h2 style="color:var(--saffron); margin-top:15px;">Dharma Log</h2>
        <div class="scribe-log" id="log"></div>
    </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>

<script>
    const SECRET_KEY = "samskrit2025";
    const Data = {
        "Balaka": ["बालकः", "बालकम्", "बालकेन", "बालकाय", "बालकात्", "बालकस्य", "बालके"],
        "Kavi": ["कविः", "कविम्", "कविना", "कवये", "कवेः", "कवेः", "कवौ"],
        "Balika": ["बालिका", "बालिकाम्", "बालिकया", "बालिकायै", "बालिकायाः", "बालिकायाः", "बालिकायाम्"],
        "Sadhu": ["साधुः", "साधुम्", "साधुना", "साधवे", "साधोः", "साधोः", "साधौ"]
    };
    const Levels = [
        { noun: "Balaka", targetIdx: 0, mission: "Find the Karta (The Boy)", hint: "Page 5: Karta = 1st Spoke." },
        { noun: "Kavi", targetIdx: 1, mission: "Find the Karma (The Poet)", hint: "Page 5: Karma = 2nd Spoke." }
    ];

    let peer, myName, role, connections = [], teamWisdom = 0;
    let state = { level: 0, rotation: 0, currentIdx: 0, currentNoun: "Balaka" };

    function initializeRole(r) {
        if (typeof Peer === 'undefined') return alert("Library failed to load. Please refresh.");
        myName = document.getElementById('scribe-name').value;
        if (!myName) return alert("Enter your name!");
        if (r === 'host' && document.getElementById('host-pass').value !== SECRET_KEY) return alert("Wrong Key!");

        role = r;
        document.getElementById('intro-overlay').style.display = 'none';
        document.getElementById('game-ui').style.display = 'grid';
        
        peer = new Peer();
        peer.on('open', id => {
            if (role === 'host') {
                document.getElementById('host-info').style.display = 'block';
                document.getElementById('my-id').innerText = id;
                document.getElementById('conn-status').innerText = "Hub Active (Waiting)";
            } else {
                const tid = document.getElementById('join-id').value.trim();
                setupConnection(peer.connect(tid));
            }
        });
        peer.on('connection', c => { if (role === 'host') setupConnection(c); });
        updateUI();
    }

    function setupConnection(conn) {
        conn.on('open', () => {
            connections.push(conn);
            document.getElementById('conn-status').innerText = (role === 'host') ? `${connections.length} Scribes Linked` : "Linked to Hub";
            logAction("System", "Sacred link established.");
        });
        conn.on('data', data => {
            if (role === 'host') connections.forEach(c => { if (c !== conn) c.send(data); });
            if (data.type === 'RESTORE') { teamWisdom += data.val; updateUI(); logAction(data.name, "restored fragment", "+" + data.val); }
        });
    }

    function updateChakra() {
        const c = document.getElementById('chakra'); c.innerHTML = '';
        Data[state.currentNoun].forEach((word, i) => {
            const s = document.createElement('div'); s.className = 'spoke'; s.innerText = word;
            s.style.transform = `rotate(${i * (360/7)}deg) translateY(-120px)`; c.appendChild(s);
        });
    }

    function rotateWheel(dir) {
        state.rotation += dir * (360/7);
        state.currentIdx = (state.currentIdx - dir + 7) % 7;
        document.getElementById('chakra').style.transform = `rotate(${state.rotation}deg)`;
    }

    function changeNoun(n) { state.currentNoun = n; updateChakra(); }

    function doRestore() {
        if (state.currentIdx === Levels[state.level].targetIdx && state.currentNoun === Levels[state.level].noun) {
            teamWisdom += 10;
            const msg = {type: 'RESTORE', val: 10, name: myName};
            if(role==='host') connections.forEach(c=>c.send(msg)); else if(connections[0]) connections[0].send(msg);
            if(state.level < Levels.length - 1) state.level++;
            updateUI();
            logAction(myName, "restored a fragment", "+10");
        } else alert("Incorrect Vibhakti Alignment!");
    }

    function logAction(u, m, v="") {
        const l = document.getElementById('log'); const e = document.createElement('div');
        e.innerHTML = `<b>${u}</b> ${m} ${v}`; l.prepend(e);
    }

    function updateUI() {
        document.getElementById('wisdom-val').innerText = teamWisdom;
        document.getElementById('mission-text').innerText = Levels[state.level].mission;
        document.getElementById('hint-text').innerText = Levels[state.level].hint;
        document.getElementById('display-name').innerText = "Scribe: " + myName;
        updateChakra();
    }
</script>
</body>
</html>
