<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Scribe Quest: The Dharma Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --saffron: #FF9933; --deep-temple: #1a0f0d; --wisdom: #2ecc71; --gold: #FFD700; --error: #e74c3c; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; background: #000; color: white; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh;
        }

        header { 
            height: 60px; background: #2d1b18; border-bottom: 2px solid var(--saffron);
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
        }

        .dashboard { 
            display: none; grid-template-columns: 280px 1fr 280px; 
            height: calc(100vh - 62px); gap: 10px; padding: 10px; box-sizing: border-box;
        }

        .panel { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,153,51,0.3);
            border-radius: 10px; display: flex; flex-direction: column; overflow: hidden;
            padding: 15px;
        }

        .main-stage { 
            display: flex; flex-direction: column; align-items: center; justify-content: space-around;
        }

        .wheel-area { 
            position: relative; display: flex; align-items: center; gap: 30px;
        }

        .wheel-container { position: relative; width: 340px; height: 340px; }
        
        .chakra { 
            width: 100%; height: 100%; border-radius: 50%; border: 10px double var(--saffron); 
            position: relative; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background: white;
        }

        .spoke { 
            position: absolute; width: 100%; text-align: center; font-weight: 900; 
            color: #3e2723; transform-origin: center; top: 50%; margin-top: -12px; font-size: 1.3rem;
        }

        .pointer { 
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            border-left: 18px solid transparent; border-right: 18px solid transparent; 
            border-top: 35px solid var(--gold); z-index: 10; filter: drop-shadow(0 2px 5px black);
        }

        .btn-circle {
            width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--saffron);
            background: rgba(255,153,51,0.2); color: white; font-size: 1.5rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-circle:hover { background: var(--saffron); }

        .restore-btn { 
            background: linear-gradient(to bottom, #FFD700, #aa8402); color: black; border: none; 
            padding: 12px 60px; font-size: 1.6rem; font-weight: bold; border-radius: 40px; cursor: pointer;
            box-shadow: 0 0 20px rgba(255,215,0,0.3);
        }

        .scribe-log { flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 5px; padding: 10px; font-size: 0.8rem; }
        .btn-vault { padding: 8px; font-size: 0.75rem; background: transparent; border: 1px solid var(--saffron); color: white; cursor: pointer; border-radius: 4px; }
        .btn-vault:hover { background: var(--saffron); }

        #intro-overlay { position: fixed; inset: 0; background: #1a0f0d; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .role-box { border: 1px solid var(--gold); padding: 20px; margin: 10px; text-align: center; width: 280px; background: rgba(255,215,0,0.05); border-radius: 10px; }
        input { padding: 10px; background: #222; border: 1px solid var(--saffron); color: white; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="intro-overlay">
    <h1 style="color:var(--saffron); font-size: 3rem; margin-bottom: 5px;">SCRIBE QUEST</h1>
    <input type="text" id="scribe-name" placeholder="आपका नाम (Your Name)">
    <div style="display:flex; gap: 15px;">
        <div class="role-box">
            <h3 style="color:var(--saffron)">Grand Librarian</h3>
            <input type="password" id="host-pass" placeholder="Sacred Key" style="width:80%">
            <button onclick="initializeRole('host')" style="width:85%; padding:10px; cursor:pointer;">HOST HUB</button>
        </div>
        <div class="role-box">
            <h3 style="color:var(--gold)">Seeking Scribe</h3>
            <input type="text" id="join-id" placeholder="Hub Code" style="width:80%">
            <button onclick="initializeRole('client')" style="width:85%; padding:10px; cursor:pointer;">JOIN HUB</button>
        </div>
    </div>
</div>

<header>
    <div id="display-name" style="color:var(--gold); font-weight:bold;">Scribe: ...</div>
    <div style="font-size: 1.2rem;">TEAM WISDOM: <span id="wisdom-val" style="color:var(--wisdom)">0</span></div>
    <div id="conn-status" style="font-size:0.8rem; color:var(--saffron)">Initializing...</div>
</header>

<div class="dashboard" id="game-ui">
    <aside class="panel">
        <h3 style="color:var(--saffron); margin-top:0; border-bottom: 1px solid var(--saffron);">वर्तमान मिशन</h3>
        <div id="mission-text" style="color:var(--gold); font-size:1.1rem; margin: 15px 0; line-height: 1.4;">---</div>
        <div id="hint-text" style="font-size:0.85rem; color:#ccc; font-style:italic; background:rgba(0,0,0,0.2); padding: 10px; border-radius: 5px;"></div>
        <div id="host-info" style="display:none; margin-top:auto; padding-top:10px; border-top: 1px solid #444;">
            <p style="font-size: 0.7rem; color: var(--saffron); margin-bottom: 5px;">Hub Code:</p>
            <b id="my-id" style="color:var(--gold); word-break: break-all; font-size: 0.75rem; background:#000; padding:5px; display:block;">...</b>
        </div>
    </aside>

    <main class="main-stage">
        <div class="wheel-area">
            <button class="btn-circle" onclick="rotateWheel(-1)">←</button>
            <div class="wheel-container">
                <div class="pointer"></div>
                <div id="chakra" class="chakra"></div>
            </div>
            <button class="btn-circle" onclick="rotateWheel(1)">→</button>
        </div>
        <button class="restore-btn" onclick="doRestore()">RESTORE FRAGMENT</button>
    </main>

    <aside class="panel">
        <h3 style="color:var(--saffron); margin-top:0; border-bottom: 1px solid var(--saffron);">शब्द भंडार (Vault)</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin: 10px 0;">
            <button class="btn-vault" onclick="changeNoun('Balaka (Masc-A)')">Balaka</button>
            <button class="btn-vault" onclick="changeNoun('Kavi (Masc-I)')">Kavi</button>
            <button class="btn-vault" onclick="changeNoun('Balika (Fem-AA)')">Balika</button>
            <button class="btn-vault" onclick="changeNoun('Sadhu (Masc-U)')">Sadhu</button>
        </div>
        <h3 style="color:var(--saffron); border-bottom: 1px solid var(--saffron); margin-top: 10px;">Dharma Log</h3>
        <div class="scribe-log" id="log"></div>
    </aside>
</div>

<script>
    const SECRET_KEY = "samskrit2025";
    
    const Data = {
        "Balaka (Masc-A)": ["-ः", "-म्", "-एन", "-ाय", "-ात्", "-स्य", "-े"],
        "Kavi (Masc-I)": ["-ः", "-म्", "-ना", "-ये", "-ेः", "-ेः", "-ौ"],
        "Balika (Fem-AA)": ["-ा", "-ाम्", "-या", "-ायै", "-ायाः", "-ायाः", "-ायाम्"],
        "Sadhu (Masc-U)": ["-ः", "-म्", "-ना", "-वे", "-ोः", "-ोः", "-ौ"]
    };

    const Levels = [
        { 
            noun: "Balaka (Masc-A)", 
            targetIdx: 0, 
            mission: "बालक ने (Karta) कार्य शुरू किया।", 
            hint: "ने = प्रथमा (1st Spoke)" 
        },
        { 
            noun: "Kavi (Masc-I)", 
            targetIdx: 1, 
            mission: "बालक ने कवि को (Karma) बुलाया।", 
            hint: "को = द्वितीया (2nd Spoke)" 
        },
        { 
            noun: "Balika (Fem-AA)", 
            targetIdx: 2, 
            mission: "बालिका के द्वारा (Karan) चित्र बनाया गया।", 
            hint: "के द्वारा = तृतीया (3rd Spoke)" 
        },
        { 
            noun: "Sadhu (Masc-U)", 
            targetIdx: 3, 
            mission: "बालिका ने साधु के लिए (Sampradan) फल लाया।", 
            hint: "के लिए = चतुर्थी (4th Spoke)" 
        }
    ];

    let peer, myName, role, connections = [], teamWisdom = 0;
    let state = { level: 0, rotation: 0, currentIdx: 0, currentNoun: "Balaka (Masc-A)" };

    function initializeRole(r) {
        myName = document.getElementById('scribe-name').value;
        if (!myName) return alert("नाम लिखें!");
        if (r === 'host' && document.getElementById('host-pass').value !== SECRET_KEY) return alert("Wrong Key!");
        
        role = r;
        document.getElementById('intro-overlay').style.display = 'none';
        document.getElementById('game-ui').style.display = 'grid';
        document.getElementById('display-name').innerText = "Scribe: " + myName;

        peer = new Peer();
        peer.on('open', id => {
            if (role === 'host') {
                document.getElementById('host-info').style.display = 'block';
                document.getElementById('my-id').innerText = id;
                document.getElementById('conn-status').innerText = "Host Online";
            } else {
                const targetId = document.getElementById('join-id').value.trim();
                setupConnection(peer.connect(targetId));
            }
        });
        peer.on('connection', c => { if (role === 'host') setupConnection(c); });
        updateUI();
    }

    function setupConnection(conn) {
        conn.on('open', () => {
            connections.push(conn);
            document.getElementById('conn-status').innerText = (role === 'host') ? `${connections.length} Scribes Joined` : "Linked to Hub";
        });
        conn.on('data', data => {
            if (role === 'host') connections.forEach(c => { if (c !== conn) c.send(data); });
            if (data.type === 'RESTORE') { teamWisdom = data.total; updateUI(); logAction(data.name, "ने खंड बहाल किया", "+" + data.val); }
        });
    }

    function updateChakra() {
        const c = document.getElementById('chakra'); c.innerHTML = '';
        Data[state.currentNoun].forEach((word, i) => {
            const s = document.createElement('
