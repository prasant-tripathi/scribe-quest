<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribe Quest: The Chakra of Wisdom</title>
    <style>
        :root { --saffron: #FF9933; --temple: #5d4037; --wisdom: #4CAF50; --error: #D32F2F; --gold: #FFD700; }
        body { font-family: 'Segoe UI', sans-serif; background: #fdf5e6; display: flex; flex-direction: column; align-items: center; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        /* Intro Overlay */
        #intro-overlay {
            position: fixed; top:0; left:0; width: 100%; height: 100%;
            background: linear-gradient(rgba(93, 64, 55, 0.95), rgba(93, 64, 55, 0.85));
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
            color: white; text-align: center; padding: 20px; box-sizing: border-box;
        }
        .intro-card { max-width: 600px; border: 2px solid var(--saffron); padding: 30px; border-radius: 15px; background: rgba(0,0,0,0.2); }

        /* Game UI */
        .game-container { display: none; width: 95%; max-width: 800px; padding: 20px; text-align: center; }
        .stats-bar { display: flex; justify-content: space-between; font-weight: bold; background: white; padding: 15px; border-radius: 10px; border-bottom: 4px solid var(--saffron); margin-bottom: 20px; }

        /* The Wheel System */
        .wheel-container { position: relative; width: 300px; height: 300px; margin: 30px auto; }
        .chakra {
            width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--temple);
            position: relative; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: white; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        .spoke {
            position: absolute; width: 100%; text-align: center; font-weight: bold;
            font-size: 1.1rem; color: var(--temple); transform-origin: center;
        }
        .pointer {
            position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 30px solid var(--saffron); z-index: 10;
        }

        /* Slots & Buttons */
        .word-slots { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .slot { border: 2px solid #ccc; padding: 15px; background: white; border-radius: 10px; min-width: 120px; }
        .slot.active { border-color: var(--saffron); box-shadow: 0 0 10px var(--saffron); }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .btn { padding: 10px 20px; cursor: pointer; border: 2px solid var(--temple); background: white; font-weight: bold; border-radius: 5px; }
        .btn:hover { background: var(--saffron); color: white; }
        .btn-primary { background: var(--temple); color: white; width: 100%; max-width: 400px; margin-top: 20px; }
    </style>
</head>
<body>

<div id="intro-overlay">
    <div class="intro-card">
        <h1>Scribe Quest: The Chakra</h1>
        <p>Spin the Wheel of Grammar to align the correct Vibhakti with the Manuscript's broken fragments.</p>
        <h3>Choose Character Gender:</h3>
        <button class="btn" onclick="initGame('M')">Masculine (Pullinga)</button>
        <button class="btn" onclick="initGame('F')">Feminine (Streelinga)</button>
    </div>
</div>

<div class="game-container" id="game-ui">
    <div class="stats-bar">
        <span>Wisdom: <span id="wisdom">0</span></span>
        <span id="rank" style="color:var(--saffron)">Rank: Initiate</span>
        <span>Flames: <span id="lives">5</span></span>
    </div>

    <div class="mission-box" style="background:#fff9f0; padding:15px; border-radius:10px; border:1px dashed var(--saffron)">
        <h3 id="mission-text">Mission Loading...</h3>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div id="chakra" class="chakra">
            </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="rotateWheel(-1)">← Spin Left</button>
        <button class="btn" onclick="rotateWheel(1)">Spin Right →</button>
    </div>

    <div class="word-slots" id="slots"></div>

    <div class="controls">
        <button class="btn" onclick="changeNoun('Balaka')">Noun: Balaka</button>
        <button class="btn" onclick="changeNoun('Kavi')">Noun: Kavi</button>
        <button class="btn" onclick="changeNoun('Balika')">Noun: Balika</button>
    </div>

    <button class="btn btn-primary" onclick="submitFragment()">RESTORE FRAGMENT</button>
    <div id="feedback" style="margin-top:15px; font-weight:bold;"></div>
</div>

<script>
    const Data = {
        "Balaka": ["बालकः", "बालकम्", "बालकेन", "बालकाय", "बालकात्", "बालकस्य", "बालके"],
        "Kavi": ["कविः", "कविम्", "कविना", "कवये", "कवेः", "कवेः", "कवौ"],
        "Balika": ["बालिका", "बालिकाम्", "बालिकया", "बालिकायै", "बालिकायाः", "बालिकायाः", "बालिकायाम्"]
    };

    const Levels = [
        { role: "karta", mission: "The Boy (Doer) sees the Poet.", targetIdx: 0, sign: "ne" },
        { role: "karma", mission: "The Poet looks at the Boy (Object).", targetIdx: 1, sign: "ko" },
        { role: "karan", mission: "The Scribe writes with a Hand (Tool).", targetIdx: 2, sign: "se" }
    ];

    let state = { wisdom: 0, lives: 5, level: 0, rotation: 0, currentIdx: 0, currentNoun: "Balaka" };

    function initGame(gender) {
        document.getElementById('intro-overlay').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        updateChakra();
        loadMission();
    }

    function updateChakra() {
        const chakra = document.getElementById('chakra');
        chakra.innerHTML = '';
        const words = Data[state.currentNoun];
        words.forEach((word, i) => {
            const spoke = document.createElement('div');
            spoke.className = 'spoke';
            spoke.innerText = word;
            spoke.style.transform = `rotate(${i * (360/7)}deg) translateY(-100px)`;
            chakra.appendChild(spoke);
        });
    }

    function rotateWheel(dir) {
        state.rotation += dir * (360/7);
        state.currentIdx = (state.currentIdx - dir + 7) % 7;
        document.getElementById('chakra').style.transform = `rotate(${state.rotation}deg)`;
    }

    function changeNoun(noun) {
        state.currentNoun = noun;
        updateChakra();
    }

    function loadMission() {
        const m = Levels[state.level];
        document.getElementById('mission-text').innerText = m.mission;
        const slots = document.getElementById('slots');
        slots.innerHTML = `<div class="slot active">${m.role.toUpperCase()}<br><small>(${m.sign})</small></div>`;
    }

    function submitFragment() {
        const fb = document.getElementById('feedback');
        if (state.currentIdx === Levels[state.level].targetIdx) {
            state.wisdom += 20;
            fb.innerText = "✓ Success! The fragment is restored.";
            fb.style.color = "var(--wisdom)";
            if (state.level < Levels.length - 1) {
                state.level++;
                setTimeout(loadMission, 1500);
            }
        } else {
            state.lives--;
            fb.innerText = "✗ Wrong Vibhakti! The wheel of Ignorance spins.";
            fb.style.color = "var(--error)";
        }
        updateUI();
    }

    function updateUI() {
        document.getElementById('wisdom').innerText = state.wisdom;
        document.getElementById('lives').innerText = state.lives;
        if (state.lives <= 0) { alert("Game Over!"); location.reload(); }
        if (state.wisdom >= 60) { document.getElementById('rank').innerText = "Rank: Scholar"; }
    }
</script>
</body>
</html>
