<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scribe Quest: The Networked Bond</title>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <style>
        :root { --saffron: #FF9933; --temple: #5d4037; --wisdom: #4CAF50; --error: #D32F2F; --gold: #FFD700; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a0f0d; color: white; margin: 0; overflow: hidden; height: 100vh; }
        .dashboard { display: grid; grid-template-columns: 320px 1fr 320px; grid-template-rows: 80px 1fr 100px; height: 100vh; gap: 10px; padding: 10px; box-sizing: border-box; }
        header { grid-column: 1 / -1; background: var(--temple); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border: 2px solid var(--saffron); }
        .panel { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 8px; }
        .scribe-log { height: 250px; background: rgba(0,0,0,0.3); padding: 10px; overflow-y: auto; border: 1px solid #444; font-size: 0.8rem; }
        .btn { padding: 10px; cursor: pointer; border: 1px solid var(--saffron); background: transparent; color: white; font-weight: bold; width: 100%; margin: 5px 0; }
        .btn:hover { background: var(--saffron); }
        #intro-overlay { position: fixed; inset: 0; background: var(--temple); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input { padding: 10px; margin: 10px; width: 250px; background: #222; color: white; border: 1px solid var(--saffron); }
    </style>
</head>
<body>

<div id="intro-overlay">
    <h1 style="color:var(--saffron)">SCRIBE ENTRANCE</h1>
    <input type="text" id="scribe-name" placeholder="Your Name">
    <button class="btn" onclick="startScribe()" style="width:270px">AWAKEN</button>
</div>

<div class="dashboard">
    <header>
        <div id="display-name">Scribe: ...</div>
        <div id="conn-status" style="color:var(--saffron)">Connecting to Akasha...</div>
        <div>TEAM WISDOM: <span id="wisdom-val" style="color:var(--gold)">0</span></div>
    </header>

    <aside class="panel">
        <h2>Network</h2>
        <p>Your Scribe Code: <b id="my-id" style="color:var(--gold)">...</b></p>
        <input type="text" id="join-id" placeholder="Friend's Code">
        <button class="btn" onclick="connectToFriend()">JOIN FRIEND</button>
        <hr>
        <button class="btn" style="background:var(--error)" onclick="sendBegAppeal()">BEG FOR MERCY</button>
    </aside>

    <main style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
        <h2 id="mission">Mission: Restore the Karta (1st Spoke)</h2>
        <div style="font-size: 3rem; margin: 20px; padding: 40px; border: 5px double var(--gold);">🔱</div>
        <button class="btn" style="background:var(--wisdom); width: 200px;" onclick="doRestore()">RESTORE</button>
    </main>

    <aside class="panel">
        <h2>Scribe's Log</h2>
        <div class="scribe-log" id="log"></div>
    </aside>
</div>

<script>
    let peer, conn, myName;
    let teamWisdom = 0;

    function startScribe() {
        myName = document.getElementById('scribe-name').value || "Unknown";
        document.getElementById('display-name').innerText = "Scribe: " + myName;
        document.getElementById('intro-overlay').style.display = 'none';

        peer = new Peer();
        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
            document.getElementById('conn-status').innerText = "Akasha Connected";
        });

        peer.on('connection', c => {
            conn = c;
            setupReceiver();
        });
    }

    function connectToFriend() {
        const id = document.getElementById('join-id').value;
        conn = peer.connect(id);
        setupReceiver();
    }

    function setupReceiver() {
        conn.on('open', () => {
            document.getElementById('conn-status').innerText = "Scribes Linked";
            logAction("System", "Link established with another scribe.");
        });
        conn.on('data', data => {
            if (data.type === 'RESTORE') {
                teamWisdom += data.val;
                updateUI();
                logAction(data.name, "restored a fragment", "+" + data.val);
            }
            if (data.type === 'BEG') {
                if(confirm(data.name + " is begging for 20 Wisdom. Sacrifice yours?")) {
                    teamWisdom -= 20;
                    conn.send({type: 'GRANT', name: myName});
                    updateUI();
                    logAction(myName, "sacrificed wisdom for " + data.name);
                }
            }
            if (data.type === 'GRANT') {
                alert("A Scribe has shown mercy! 1 Flame restored.");
                logAction(data.name, "granted mercy");
            }
        });
    }

    function doRestore() {
        teamWisdom += 10;
        updateUI();
        logAction(myName, "restored a fragment", "+10");
        if(conn) conn.send({type: 'RESTORE', val: 10, name: myName});
    }

    function sendBegAppeal() {
        if(conn) {
            conn.send({type: 'BEG', name: myName});
            logAction(myName, "sent an appeal for mercy");
        }
    }

    function logAction(user, msg, val = "") {
        const entry = document.createElement('div');
        entry.innerHTML = `<b>${user}</b> ${msg} <span style="color:var(--gold)">${val}</span>`;
        document.getElementById('log').prepend(entry);
    }

    function updateUI() {
        document.getElementById('wisdom-val').innerText = teamWisdom;
    }
</script>
</body>
</html>
