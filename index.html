<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Scribe Quest: The Absolute Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --saffron: #FF9933; --deep-temple: #1a0f0d; --wisdom: #2ecc71; --gold: #FFD700; --error: #ff4444; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: white; margin: 0; padding: 0; overflow: hidden; height: 100vh; }
        header { height: 70px; background: #2d1b18; border-bottom: 2px solid var(--saffron); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .progress-track { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; margin-top: 5px; }
        #progress-bar { width: 0%; height: 100%; background: var(--gold); transition: width 0.5s ease; }
        .dashboard { display: none; grid-template-columns: 300px 1fr 300px; height: calc(100vh - 72px); gap: 15px; padding: 15px; box-sizing: border-box; }
        .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,153,51,0.2); border-radius: 12px; display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        #pyramid-container { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; pointer-events: none; z-index: 5; }
        .pyramid-row { display: flex; gap: 2px; }
        .block { width: 16px; height: 10px; background: var(--gold); border: 1px solid #000; opacity: 0.1; transition: 0.5s; }
        .block.active { opacity: 1; box-shadow: 0 0 5px var(--gold); }
        .main-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .chakra { width: 340px; height: 340px; border-radius: 50%; border: 10px double var(--saffron); position: relative; transition: transform 0.6s; background: white; margin: 20px 0; }
        #topic-indicator { color: var(--saffron); font-weight: bold; font-size: 1rem; margin-bottom: -15px; z-index: 15; text-shadow: 0 0 5px black;}
        .pointer { width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid var(--gold); z-index: 10; filter: drop-shadow(0 0 10px black); }
        .spoke { position: absolute; width: 100%; text-align: center; font-weight: 900; color: #3e2723; transform-origin: center; top: 50%; margin-top: -12px; font-size: 1.1rem; }
        .restore-btn { background: var(--gold); color: black; border: none; padding: 12px 40px; font-size: 1.6rem; font-weight: bold; border-radius: 50px; cursor: pointer; margin-top: 15px;}
        .scribe-log { flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 10px; font-size: 0.8rem; border: 1px solid #333; margin-top: 10px;}
        .freeze-btn { background: var(--error); color: white; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }
        #frozen-msg { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--error); font-size: 1.5rem; font-weight: bold; z-index: 100; text-align: center; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; border: 2px solid var(--error); }
        #intro-overlay { position: fixed; inset: 0; background: #1a0f0d; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn { padding: 8px; cursor: pointer; border: 1px solid var(--saffron); background: transparent; color: white; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div id="intro-overlay">
    <h1 style="color:var(--saffron); font-size: 3rem;">SCRIBE QUEST</h1>
    <input type="text" id="scribe-name" placeholder="अपना नाम लिखें" style="padding:10px; margin-bottom:20px; width:250px;">
    <div style="display:flex; gap: 20px;">
        <div style="border:1px solid var(--gold); padding:15px; border-radius:10px; text-align:center;">
            <h3>Librarian</h3>
            <input type="password" id="host-pass" placeholder="Key" style="width:60px;">
            <button class="btn" onclick="initializeRole('host')">Open Hub</button>
        </div>
        <div style="border:1px solid var(--gold); padding:15px; border-radius:10px; text-align:center;">
            <h3>Scribe</h3>
            <input type="text" id="join-id" placeholder="Code" style="width:100px;">
            <button class="btn" onclick="initializeRole('client')">Join Hub</button>
        </div>
    </div>
</div>

<header>
    <div id="display-name" style="color:var(--gold); font-weight:bold;">Scribe: ...</div>
    <div style="flex-grow: 1; margin: 0 60px; text-align: center;">
        <span style="font-size:0.7rem; color:var(--gold); letter-spacing:1px;">जादुई त्रिकोण प्रगति</span>
        <div class="progress-track"><div id="progress-bar"></div></div>
    </div>
    <div style="text-align: right; min-width:150px;">
        <div style="font-size: 1.4rem; color:var(--wisdom)">WISDOM: <span id="wisdom-val">0</span></div>
        <div id="conn-status" style="font-size:0.7rem; color:var(--saffron)">Offline</div>
    </div>
</header>

<div class="dashboard" id="game-ui">
    <aside class="panel">
        <h3 id="story-title" style="color:var(--saffron); margin:0;">STORY 1</h3>
        <div style="background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; margin: 10px 0; border-left: 4px solid var(--saffron);">
            <h4 style="margin:0; font-size:0.8rem; color:var(--saffron)">उद्देश्य</h4>
            <div id="mission-text" style="color:var(--gold); font-size: 0.95rem;">---</div>
        </div>
        <h3 style="color:var(--saffron); font-size: 0.9rem;">शब्द भंडार</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 5px;">
            <button class="btn" onclick="changeNoun('Balaka')">बालक</button>
            <button class="btn" onclick="changeNoun('Kavi')">कवि</button>
            <button class="btn" onclick="changeNoun('Balika')">बालिका</button>
            <button class="btn" onclick="changeNoun('Sadhu')">साधु</button>
        </div>
        <div id="host-info" style="display:none; margin-top:auto; font-size:0.7rem;">
            Code: <b id="my-id" style="color:var(--gold)">...</b>
            <button class="btn" style="padding:2px 5px; font-size:0.6rem; margin-top:5px;" onclick="copyCode()">Copy Code</button>
        </div>
    </aside>

    <main class="main-stage" id="main-stage">
        <div id="frozen-msg">अवरुद्ध (PAUSED)</div>
        <div id="topic-indicator">प्रथमा (KARTA)</div>
        <div class="pointer"></div>
        <div class="wheel-area" style="display:flex; align-items:center; gap:20px;">
            <button class="btn" style="border-radius:50%; width:45px; height:45px;" onclick="rotateWheel(-1)">←</button>
            <div style="position:relative;">
                <div id="chakra" class="chakra"></div>
                <div id="pyramid-container"></div>
            </div>
            <button class="btn" style="border-radius:50%; width:45px; height:45px;" onclick="rotateWheel(1)">→</button>
        </div>
        <button id="restore-btn" class="restore-btn" onclick="doRestore()">वर्ण सूत्र जोड़ें</button>
    </main>

    <aside class="panel">
        <h3 style="color:var(--saffron); margin:0; font-size: 0.9rem;">Scribe Roster</h3>
        <div id="roster-list" style="max-height:100px; overflow-y:auto; font-size:0.8rem;"></div>
        <h3 style="color:var(--saffron); margin:10px 0 5px 0; font-size: 0.9rem;">Dharma Log</h3>
        <div id="log" class="scribe-log"></div>
    </aside>
</div>

<script>
    const SECRET_KEY = "samskrit2025";
    const Data = {
        "Balaka": ["बालकः", "बालकम्", "बालकेन", "बालकाय", "बालकात्", "बालकस्य", "बालके"],
        "Kavi": ["कविः", "कविम्", "कविना", "कवये", "कवेः", "कवेः", "कवौ"],
        "Balika": ["बालिका", "बालिकाम्", "बालिकया", "बालिकायै", "बालिकायाः", "बालिकायाः", "बालिकायाम्"],
        "Sadhu": ["साधुः", "साधुम्", "साधुना", "साधवे", "साधोः", "साधोः", "साधौ"]
    };
    const Topics = ["प्रथमा (KARTA)", "द्वितीया (KARMA)", "तृतीया (KARAN)", "चतुर्थी (SAMPRADAN)", "पञ्चमी (APADAN)", "षष्ठी (SAMBANDH)", "सप्तमी (ADHIKARAN)"];
    
    // logic based on your notes for 36 questions
    const Questions = Array.from({length: 36}, (_, i) => {
        const nouns = Object.keys(Data);
        const n = nouns[i % 4];
        const idx = i % 7;
        return { n, idx, mission: `${n} से संबंधित ${Topics[idx]} का सूत्र चुनें।` };
    });

    let peer, myName, role, connections = {}, teamWisdom = 0, scribes = {};
    let state = { qIdx: 0, rotation: 0, wheelIdx: 0, currentNoun: "Balaka", frozen: false };

    function getLevelInfo() {
        if (state.qIdx < 11) return { story: 1, title: "Foundation", pen: 5 };
        if (state.qIdx < 20) return { story: 2, title: "Rising Pillar", pen: 10 };
        if (state.qIdx < 27) return { story: 3, title: "Sanctum Entrance", pen: 15 };
        if (state.qIdx < 32) return { story: 4, title: "Inner Chamber", pen: 20 };
        if (state.qIdx < 35) return { story: 5, title: "Scriptorium", pen: 25 };
        return { story: 6, title: "Apex Zenith", pen: 30 };
    }

    function initPyramid() {
        const container = document.getElementById('pyramid-container');
        const rows = [11, 9, 7, 5, 3, 1];
        rows.forEach((count, rIdx) => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'pyramid-row';
            for(let i=0; i<count; i++) {
                const b = document.createElement('div');
                b.className = 'block'; b.id = `block-${rIdx}-${i}`;
                rowDiv.appendChild(b);
            }
            container.appendChild(rowDiv);
        });
    }

    function updatePyramid() {
        let totalActive = 0;
        const rows = [11, 9, 7, 5, 3, 1];
        for (let r = 0; r < rows.length; r++) {
            for (let c = 0; c < rows[r]; c++) {
                const el = document.getElementById(`block-${r}-${c}`);
                if (totalActive < state.qIdx) el.classList.add('active');
                else el.classList.remove('active');
                totalActive++;
            }
        }
    }

    function initializeRole(r) {
        myName = document.getElementById('scribe-name').value;
        if (!myName) return alert("नाम लिखें!");
        if (r === 'host' && document.getElementById('host-pass').value !== SECRET_KEY) return alert("Wrong Key!");
        role = r;
        document.getElementById('intro-overlay').style.display = 'none';
        document.getElementById('game-ui').style.display = 'grid';
        document.getElementById('display-name').innerText = "Scribe: " + myName;
        initPyramid();
        peer = new Peer();
        peer.on('open', id => {
            if (role === 'host') {
                document.getElementById('host-info').style.display = 'block';
                document.getElementById('my-id').innerText = id;
                document.getElementById('conn-status').innerText = "Hub Active";
                logAction("System", "Hub is open.");
            } else setupConnection(peer.connect(document.getElementById('join-id').value.trim()));
        });
        peer.on('connection', conn => { if (role === 'host') setupConnection(conn); });
        updateUI();
    }

    function setupConnection(conn) {
        conn.on('open', () => {
            conn.send({ type: 'HELLO', name: myName });
            document.getElementById('conn-status').innerText = "Linked";
        });
        conn.on('data', data => {
            if (role === 'host') {
                Object.values(connections).forEach(c => { if (c.peer !== conn.peer) c.send(data); });
                if (data.type === 'HELLO') {
                    connections[conn.peer] = conn;
                    scribes[conn.peer] = { name: data.name, frozen: false };
                    updateRoster();
                    broadcastLog(data.name, "joined the hub.");
                    conn.send({ type: 'SYNC', total: teamWisdom, q: state.qIdx });
                }
            }
            if (data.type === 'RESTORE') { teamWisdom = data.total; state.qIdx = data.q; updateUI(); logAction(data.name, "ने सूत्र जोड़ा!", "+" + data.val); }
            if (data.type === 'PENALTY') { teamWisdom = data.total; updateUI(); logAction(data.name, "ने गलती की!", "-" + data.val); }
            if (data.type === 'LOG') { logAction(data.user, data.msg); }
            if (data.type === 'FREEZE') { state.frozen = data.val; updateFreezeUI(); }
            if (data.type === 'SYNC') { teamWisdom = data.total; state.qIdx = data.q; updateUI(); }
        });
    }

    function broadcastLog(user, msg) {
        const payload = { type: 'LOG', user, msg };
        if (role === 'host') { Object.values(connections).forEach(c => c.send(payload)); logAction(user, msg); }
        else if (Object.values(connections)[0]) Object.values(connections)[0].send(payload);
    }

    function doRestore() {
        if (state.frozen) return;
        const q = Questions[state.qIdx];
        const info = getLevelInfo();
        if (state.wheelIdx === q.idx && state.currentNoun === q.n) {
            teamWisdom += 20; state.qIdx++;
            const msg = { type: 'RESTORE', val: 20, total: teamWisdom, q: state.qIdx, name: myName };
            broadcast(msg); logAction(myName, "सफलता!", "+20"); updateUI();
        } else {
            teamWisdom = Math.max(0, teamWisdom - info.pen);
            const msg = { type: 'PENALTY', val: info.pen, total: teamWisdom, name: myName };
            broadcast(msg); logAction(myName, "गलत संरेखण!", "-"+info.pen); updateUI();
        }
    }

    function broadcast(msg) {
        if (role === 'host') Object.values(connections).forEach(c => c.send(msg));
        else if (Object.values(connections)[0]) Object.values(connections)[0].send(msg);
    }

    function updateUI() {
        const info = getLevelInfo();
        document.getElementById('wisdom-val').innerText = teamWisdom;
        document.getElementById('story-title').innerText = `STORY ${info.story}: ${info.title}`;
        document.getElementById('mission-text').innerText = state.qIdx < 36 ? Questions[state.qIdx].mission : "परम लक्ष्य प्राप्त!";
        document.getElementById('progress-bar').style.width = (state.qIdx / 36 * 100) + "%";
        document.getElementById('topic-indicator').innerText = state.qIdx < 36 ? Topics[Questions[state.qIdx].idx] : "विजयी";
        updateChakra(); updatePyramid();
    }

    function updateChakra() {
        const c = document.getElementById('chakra'); c.innerHTML = '';
        Data[state.currentNoun].forEach((word, i) => {
            const s = document.createElement('div'); s.className = 'spoke'; s.innerText = word;
            s.style.transform = `rotate(${i * (360/7)}deg) translateY(-120px)`; c.appendChild(s);
        });
    }

    function rotateWheel(dir) { if (!state.frozen) { state.rotation += dir * (360/7); state.wheelIdx = (state.wheelIdx - dir + 7) % 7; document.getElementById('chakra').style.transform = `rotate(${state.rotation}deg)`; } }
    function changeNoun(n) { if (!state.frozen) { state.currentNoun = n; updateChakra(); } }
    function logAction(u, m) { const l = document.getElementById('log'); const e = document.createElement('div'); e.innerHTML = `<b>${u}</b> ${m}`; l.prepend(e); }
    function copyCode() { navigator.clipboard.writeText(document.getElementById('my-id').innerText); alert("Code copied!"); }
    function updateRoster() { const list = document.getElementById('roster-list'); list.innerHTML = ''; Object.keys(scribes).forEach(id => { const div = document.createElement('div'); div.style.display = "flex"; div.style.justifyContent = "space-between"; const fBtn = role === 'host' ? `<button class="freeze-btn" onclick="toggleFreeze('${id}')">${scribes[id].frozen ? 'Unfreeze' : 'Freeze'}</button>` : ''; div.innerHTML = `<span>📖 ${scribes[id].name}</span> ${fBtn}`; list.appendChild(div); }); }
    function toggleFreeze(pid) { scribes[pid].frozen = !scribes[pid].frozen; connections[pid].send({ type: 'FREEZE', val: scribes[pid].frozen }); broadcastLog("Librarian", (scribes[pid].frozen ? "paused " : "unpaused ") + scribes[pid].name); updateRoster(); }
    function updateFreezeUI() { document.getElementById('main-stage').style.filter = state.frozen ? "grayscale(1) brightness(0.5)" : "none"; document.getElementById('restore-btn').disabled = state.frozen; document.getElementById('frozen-msg').style.display = state.frozen ? 'block' : 'none'; }
</script>
</body>
</html>
