<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Scribe Quest: Optimized Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --saffron: #FF9933; --deep-temple: #1a0f0d; --wisdom: #2ecc71; --gold: #FFD700; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: white; margin: 0; padding: 0; overflow: hidden; height: 100vh; }
        
        header { 
            height: 70px; background: #2d1b18; border-bottom: 2px solid var(--saffron);
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
        }

        /* Progress Bar Update: No outline, cleaner integration */
        .goal-container { flex-grow: 1; margin: 0 60px; text-align: center; }
        .progress-track { 
            width: 100%; height: 10px; background: rgba(255,255,255,0.1); 
            border-radius: 5px; overflow: hidden; margin-top: 8px; 
        }
        #progress-bar { width: 0%; height: 100%; background: var(--gold); transition: width 0.8s ease; box-shadow: 0 0 10px var(--gold); }
        .goal-label { font-size: 0.75rem; color: var(--gold); letter-spacing: 2px; }

        .dashboard { display: none; grid-template-columns: 300px 1fr 300px; height: calc(100vh - 72px); gap: 15px; padding: 15px; box-sizing: border-box; }
        .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,153,51,0.2); border-radius: 12px; display: flex; flex-direction: column; padding: 15px; overflow: hidden; }

        /* Left Side: Logic */
        .mission-panel { display: flex; flex-direction: column; gap: 20px; }
        .uddeshya-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; border-left: 4px solid var(--saffron); }
        .vault-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        /* Center Side: Action */
        .main-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .wheel-area { display: flex; align-items: center; gap: 30px; }
        .wheel-container { position: relative; width: 360px; height: 360px; }
        .chakra { width: 100%; height: 100%; border-radius: 50%; border: 12px double var(--saffron); position: relative; transition: transform 0.6s; background: white; }
        .spoke { position: absolute; width: 100%; text-align: center; font-weight: 900; color: #3e2723; transform-origin: center; top: 50%; margin-top: -12px; font-size: 1.25rem; }
        .pointer { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid var(--gold); z-index: 10; filter: drop-shadow(0 0 10px black); }

        /* Right Side: Social */
        .scribe-log { flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 10px; font-size: 0.85rem; margin-top: 10px; }
        .roster-list { max-height: 150px; overflow-y: auto; margin-bottom: 10px; }
        .roster-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; font-size: 0.9rem; }

        /* General UI Elements */
        .btn { padding: 10px; cursor: pointer; border: 1px solid var(--saffron); background: transparent; color: white; border-radius: 5px; font-weight: bold; }
        .btn:hover { background: var(--saffron); }
        .restore-btn { background: var(--gold); color: black; border: none; padding: 15px 50px; font-size: 1.8rem; font-weight: bold; border-radius: 50px; margin-top: 30px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        #intro-overlay { position: fixed; inset: 0; background: #1a0f0d; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="intro-overlay">
    <h1 style="color:var(--saffron); font-size: 3.5rem; margin:0;">SCRIBE QUEST</h1>
    <p style="color:var(--gold); margin-bottom: 30px;">Dharma Manuscript Restoration</p>
    <input type="text" id="scribe-name" placeholder="आपका नाम (Name)" style="padding:12px; width:280px; margin-bottom:15px; background:#222; border:1px solid var(--saffron); color:white;">
    <div style="display:flex; gap: 20px;">
        <div style="border:1px solid var(--gold); padding:20px; text-align:center;">
            <h3>Librarian (Host)</h3>
            <input type="password" id="host-pass" placeholder="Sacred Key" style="width:100px;">
            <button class="btn" onclick="initializeRole('host')">OPEN HUB</button>
        </div>
        <div style="border:1px solid var(--gold); padding:20px; text-align:center;">
            <h3>Scribe (Join)</h3>
            <input type="text" id="join-id" placeholder="Hub Code" style="width:100px;">
            <button class="btn" onclick="initializeRole('client')">JOIN HUB</button>
        </div>
    </div>
</div>

<header>
    <div id="display-name" style="color:var(--gold); font-weight:bold; min-width: 180px;">Scribe: ...</div>
    <div class="goal-container">
        <span class="goal-label">पाण्डुलिपि पूर्णता (MANUSCRIPT COMPLETION)</span>
        <div class="progress-track">
            <div id="progress-bar"></div>
        </div>
    </div>
    <div style="min-width: 180px; text-align: right;">
        <div style="font-size: 1.4rem; color:var(--wisdom)">WISDOM: <span id="wisdom-val">0</span></div>
        <div id="conn-status" style="font-size:0.75rem; color:var(--saffron)">Hub Active</div>
    </div>
</header>

<div class="dashboard" id="game-ui">
    <aside class="panel mission-panel">
        <div class="uddeshya-box">
            <h3 style="color:var(--saffron); margin:0 0 10px 0;">उद्देश्य (Uddeshya)</h3>
            <div id="mission-text" style="color:var(--gold); font-size: 1.2rem; line-height:1.4;">---</div>
        </div>
        
        <div>
            <h3 style="color:var(--saffron); margin:0 0 10px 0;">शब्द भंडार (Vault)</h3>
            <div class="vault-grid">
                <button class="btn" onclick="changeNoun('Balaka')">Balaka</button>
                <button class="btn" onclick="changeNoun('Kavi')">Kavi</button>
                <button class="btn" onclick="changeNoun('Balika')">Balika</button>
                <button class="btn" onclick="changeNoun('Sadhu')">Sadhu</button>
            </div>
        </div>
        
        <div id="host-info" style="display:none; margin-top:auto; font-size:0.8rem;">
            <p style="color:var(--saffron); margin:0;">Your Hub Code:</p>
            <b id="my-id" style="color:var(--gold); word-break:break-all;">...</b>
        </div>
    </aside>

    <main class="main-stage">
        <div class="wheel-area">
            <button class="btn" style="border-radius:50%; width:50px; height:50px;" onclick="rotateWheel(-1)">←</button>
            <div class="wheel-container">
                <div class="pointer"></div>
                <div id="chakra" class="chakra"></div>
            </div>
            <button class="btn" style="border-radius:50%; width:50px; height:50px;" onclick="rotateWheel(1)">→</button>
        </div>
        <button class="restore-btn" onclick="doRestore()">वर्ण सूत्र जोड़ें</button>
    </main>

    <aside class="panel">
        <h3 style="color:var(--saffron); margin:0 0 10px 0;">Scribe Roster</h3>
        <div id="roster-list" class="roster-list"></div>
        
        <h3 style="color:var(--saffron); margin:15px 0 10px 0;">Dharma Log</h3>
        <div id="log" class="scribe-log"></div>
    </aside>
</div>
